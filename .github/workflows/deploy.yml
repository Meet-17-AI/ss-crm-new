name: Deploy CRM Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Navigate to CRM directory (create if it doesn't exist)
            mkdir -p /opt/ss-crm
            cd /opt/ss-crm

            # If git repo is not initialized, clone using PAT token
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${{ secrets.GH_PAT }}@github.com/safestories-tech/safestories-crm.git
            else
              # Update remote URL with fresh token on every deploy
              git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/safestories-tech/safestories-crm.git
            fi

            # Pull latest changes
            git fetch --all
            git reset --hard origin/main
            
            # Create .env.production file from GitHub Secrets
            cat > .env.production << 'EOF'
            NODE_ENV=production
            PORT=3002
            
            # Database
            PGHOST=${{ secrets.PGHOST }}
            PGPORT=${{ secrets.PGPORT }}
            PGDATABASE=${{ secrets.PGDATABASE }}
            PGUSER=${{ secrets.PGUSER }}
            PGPASSWORD=${{ secrets.PGPASSWORD }}
            
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            # Frontend & Domain
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME || secrets.VPS_HOST }}
            
            # MinIO
            MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
            MINIO_PORT=${{ secrets.MINIO_PORT }}
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}
            MINIO_USE_SSL=${{ secrets.MINIO_USE_SSL }}
            
            # Razorpay
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            
            # Gmail
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            
            # Webhooks
            N8N_WEBHOOK_FETCH_SLOTS_PUBLIC=${{ secrets.N8N_WEBHOOK_FETCH_SLOTS_PUBLIC }}
            N8N_WEBHOOK_FETCH_SLOTS_ADMIN_DIRECT=${{ secrets.N8N_WEBHOOK_FETCH_SLOTS_ADMIN_DIRECT }}
            N8N_WEBHOOK_FETCH_SLOTS_ADMIN_PAYMENT=${{ secrets.N8N_WEBHOOK_FETCH_SLOTS_ADMIN_PAYMENT }}
            N8N_WEBHOOK_CREATE_BOOKING_PUBLIC=${{ secrets.N8N_WEBHOOK_CREATE_BOOKING_PUBLIC }}
            N8N_WEBHOOK_CREATE_BOOKING_ADMIN_DIRECT=${{ secrets.N8N_WEBHOOK_CREATE_BOOKING_ADMIN_DIRECT }}
            N8N_WEBHOOK_CANCEL_BOOKING=${{ secrets.N8N_WEBHOOK_CANCEL_BOOKING }}
            N8N_WEBHOOK_RESCHEDULE_BOOKING=${{ secrets.N8N_WEBHOOK_RESCHEDULE_BOOKING }}
            N8N_WEBHOOK_ISSUE_REPORT=${{ secrets.N8N_WEBHOOK_ISSUE_REPORT }}
            N8N_WEBHOOK_SOS_EMAIL=${{ secrets.N8N_WEBHOOK_SOS_EMAIL }}
            EOF

            # CRITICAL: docker compose interpolates ${DOMAIN_NAME} etc. in labels
            # from .env (or shell env), NOT from env_file (.env.production).
            # Without this, Traefik router rules become Host(`crm.backend.`)
            # and every request 404s.
            cp .env.production .env

            # Ensure the docker volume exists
            docker volume inspect crm_backend_data >/dev/null 2>&1 || docker volume create crm_backend_data
            
            # Rebuild and restart the container
            echo "🚀 Building crm-backend..."
            docker compose build crm-backend
            
            echo "🔄 Starting crm-backend (rolling update)..."
            docker compose up -d crm-backend
            
            # Verify container is actually running and healthy
            echo "⏳ Waiting for container to become healthy..."
            
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ss-crm-backend 2>/dev/null || echo "not_found")
              echo "  Health check attempt $i/12: $STATUS"
              
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ CRM Backend is running and healthy!"
                docker compose ps

                # ── Traefik routing diagnostics ──
                echo "── DIAG: DOMAIN_NAME check ──"
                DN=$(grep '^DOMAIN_NAME=' .env.production | cut -d= -f2)
                if [ "$DN" = "srv1169280.hstgr.cloud" ]; then echo "DOMAIN_NAME OK"; else echo "DOMAIN_NAME MISMATCH (len=${#DN})"; fi
                echo "── DIAG: container networks ──"
                docker inspect ss-crm-backend --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
                echo "── DIAG: traefik containers ──"
                docker ps --format '{{.Names}} | {{.Status}}' | grep -i traefik || echo "no traefik container found"
                echo "── DIAG: available docker networks ──"
                docker network ls --format '{{.Name}}'
                echo "── DIAG: request via traefik with Host header ──"
                curl -s -o /dev/null -w 'traefik->crm.backend host: %{http_code}\n' --max-time 5 -H "Host: crm.backend.srv1169280.hstgr.cloud" http://127.0.0.1/health || true
                curl -sk -o /dev/null -w 'traefik https: %{http_code}\n' --max-time 5 --resolve crm.backend.srv1169280.hstgr.cloud:443:127.0.0.1 https://crm.backend.srv1169280.hstgr.cloud/health || true
                echo "── DIAG: traefik discovered routers (if api enabled) ──"
                TRAEFIK_NAME=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
                if [ -n "$TRAEFIK_NAME" ]; then
                  docker exec $TRAEFIK_NAME wget -qO- http://127.0.0.1:8080/api/http/routers 2>/dev/null | tr ',' '\n' | grep -i 'crm-backend\|rule' | head -20 || echo "traefik api not reachable"
                  echo "── DIAG: traefik recent logs ──"
                  docker logs --tail 20 $TRAEFIK_NAME 2>&1 | tail -20
                fi
                exit 0
              elif [ "$STATUS" = "unhealthy" ]; then
                echo "🚨 Container is unhealthy! Fetching logs..."
                docker compose logs --tail=50 crm-backend
                docker compose stop crm-backend
                exit 1
              elif [ "$STATUS" = "not_found" ]; then
                echo "🚨 Container not found! Build may have failed."
                exit 1
              fi
            done
            
            echo "⚠️ Container did not become healthy within 60 seconds."
            docker compose logs --tail=30 crm-backend
            exit 1
